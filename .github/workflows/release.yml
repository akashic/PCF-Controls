name: Release

# Push a tag named <ControlName>-v<x.y.z>, e.g. GridFormatter-v1.0.0, on a commit that's on main.
on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      control: ${{ steps.control.outputs.name }}
      notes-start-tag: ${{ steps.previous.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, branches and tags: the main-branch check and the previous tag need them.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main. Merge to main first, then tag the merge commit."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install
        run: npm ci
      - name: Check tag matches the control's versions
        run: node scripts/check-controls.mjs --tag "$GITHUB_REF_NAME"
      - id: control
        name: Resolve control from tag
        run: echo "name=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_OUTPUT"
      - id: previous
        name: Find the control's previous release tag
        env:
          CONTROL: ${{ steps.control.outputs.name }}
        run: |
          # The highest version below this one, so the notes cover only this control's changes since its last release.
          previous=""
          for t in $(git tag --list "${CONTROL}-v*" --sort=-v:refname); do
            if [ "$t" != "$GITHUB_REF_NAME" ] && [ "$(printf '%s\n' "$t" "$GITHUB_REF_NAME" | sort -V | head -n1)" = "$t" ]; then
              previous="$t"
              break
            fi
          done
          echo "Previous tag: ${previous:-none (first release)}"
          echo "tag=$previous" >> "$GITHUB_OUTPUT"
      - name: Lint and test
        run: |
          npm run lint
          npm test
          npm run test:scripts
      - name: Validate control config files against their JSON Schemas
        run: npm run validate:config
      - name: Build solution (managed + unmanaged)
        run: dotnet build "controls/${{ steps.control.outputs.name }}/solution" -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: solution
          path: controls/${{ steps.control.outputs.name }}/solution/bin/Release/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: solution
          path: solution
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTROL: ${{ needs.build.outputs.control }}
          NOTES_START_TAG: ${{ needs.build.outputs.notes-start-tag }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$CONTROL ${GITHUB_REF_NAME##*-v}" \
            --generate-notes \
            ${NOTES_START_TAG:+--notes-start-tag "$NOTES_START_TAG"} \
            solution/*.zip
